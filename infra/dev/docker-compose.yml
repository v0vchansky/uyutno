services:
  postgres:
    image: postgres:18-alpine
    container_name: uyutno-postgres-dev
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: uyutno
      POSTGRES_PASSWORD: uyutno
      POSTGRES_DB: uyutno
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
